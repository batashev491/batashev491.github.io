<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Media</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div class="container">
    <h1>Interactive Media</h1>
    
    <video id="video-player" controls>
      <source src="example.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div id="info-box" class="hidden">
      Welcome to the interactive video experience!
    </div>

    <img id="info-image" class="hidden" src="example-image.jpg" alt="Interactive Graphic">
    
    <div id="background"></div>

    <section id="description-box">
      <iframe id="contentIframe" src=""></iframe>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
