<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rich Media Player</title>
  <link rel="stylesheet" href="Stylesheet.css">
</head>
<body>
  <h1>Rich Media Player</h1>

  <!-- Audio Section -->
  <div class="media-container">
    <h2>Audio Player</h2>
    <audio id="audio-player" controls>
      <source id="audio-source" src="audio/audio1.mp3" type="audio/mpeg">
      <source src="audio/audio1.ogg" type="audio/ogg">
      Your browser does not support the audio element.
    </audio>
    <br>
    <!-- Button to switch audio tracks -->
    <button id="switch-audio">Switch Audio</button>
  </div>

  <!-- Video Section -->
  <div class="media-container">
    <h2>Video Player</h2>
    <video id="video-player" width="640" controls>
      <source id="video-source" src="video/video1.mp4" type="video/mp4">
      <source src="video/video1.webm" type="video/webm">
      <track src="video/captions1.vtt" kind="subtitles" srclang="en" label="English" default>
      Your browser does not support the video element.
    </video>
    <div class="media-controls">
      <button id="play-pause-btn">Play</button>
      <button id="slow-speed-btn">Slow Speed</button>
      <button id="normal-speed-btn">Normal Speed</button>
      <button id="fast-speed-btn">Fast Speed</button>
      <button id="fast-forward-btn">Fast Forward</button>
      <input type="range" id="seek-bar" value="0" min="0" max="100">
    </div>
    <!-- Button to switch video tracks -->
    <button id="switch-video">Switch Video</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
